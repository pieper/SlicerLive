<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlicerLive</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* legacy (streamed Slicer) mode keeps its own light chrome; ?legacy */
  body.legacy { background: #e8e8e8; color: #222; }
  body.legacy #app { position: relative; width: 100vw; height: 100vh; }
  #gui { position: absolute; inset: 0; }
  #gui canvas.legacy-region { image-rendering: auto; }
  #gui canvas.popup { box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  body.legacy #views { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 20; pointer-events: none; }
  #views .lv-cell { pointer-events: auto; }
  #link { position: absolute; left: 8px; bottom: 26px; font: 11px system-ui; color: #9aa; z-index: 5; pointer-events: none; }
  body.legacy #link { bottom: 6px; }
  #status { position: fixed; right: 8px; bottom: 26px; z-index: 1000; font: 11px system-ui; color: var(--sl-fg-muted, #445); background: rgba(0,0,0,.35); padding: 2px 8px; border-radius: 6px; pointer-events: none; }
  body.legacy #status { color: #445; background: rgba(255,255,255,.7); bottom: 8px; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="status">starting…</div>
  <div id="link" title="gui stream: round-trip · throughput · frame codec"></div>
  <script type="module" src="slicer-app.js"></script>
</body>
</html>
