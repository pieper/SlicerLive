<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ReMINDer compare — COMPARE-CENTRIC. Every row is a PAIR (A ⇄ B) over the same anatomy,
     x selectable {axial, sagittal, coronal, 3D} columns. One set of compare controls drives
     every row at once; what is per-row is only the pair itself. Opens on
     pre-op T1+Gd ⇄ pre-dura US; added rows step through extent-of-resection and
     pre-op-vs-intra-op. Pixels stream straight from IDC's public bucket, and only the
     volumes some row references are resident.   ?case=<pid>&rows=1|2|3 -->
<title>ReMINDer — compare</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #05060a; color: #d6e2f2;
               font: 12px -apple-system, system-ui, sans-serif; overflow: hidden; }
  #page { display: flex; flex-direction: column; height: 100vh; }
  /* the shared demo chrome parks a fixed "?" top-left and the SlicerLive logo top-right */
  header { display: flex; align-items: center; gap: 12px; padding: 5px 132px 5px 52px; background: #0b0e16;
           border-bottom: 1px solid #1b2740; flex: 0 0 auto; flex-wrap: wrap; min-height: 34px; }
  header h1 { font-size: 13px; margin: 0; color: #9fb3d0; font-weight: 700; letter-spacing: .3px; }
  #info { color: #7d92b5; }
  #info b { color: #d6e2f2; }
  #hdr-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  #status { color: #9fb3d0; }
  #cols { display: flex; gap: 4px; }
  .chip { font: 600 11px -apple-system, system-ui, sans-serif; color: #d6e2f2; background: #1b2740;
          border: 1px solid #33507e; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  .chip.on { background: #2b6cb0; border-color: #3f86d0; color: #fff; }
  .chip:disabled { opacity: .4; cursor: default; }

  /* ── the global compare bar: ONE set of controls for every row ───────────── */
  #cmpbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 5px 12px;
            background: #0d1119; border-bottom: 1px solid #1b2740; font-size: 11px; color: #7d92b5; }
  #cmpbar .cmplabel { font: 800 9.5px -apple-system, system-ui, sans-serif; letter-spacing: .08em; color: #f0d24a; }
  #cmp-fade { width: 220px; accent-color: #f0d24a; }
  #cmp-note { font-variant-numeric: tabular-nums; min-width: 128px; }
  #cmp-count { margin-left: auto; color: #4d5c78; }
  .hintkey { color: #4d5c78; }
  .hintkey b { color: #9fb3d0; font-weight: 600; }

  /* ── compare rows ────────────────────────────────────────────────────────── */
  #rows { flex: 1; display: flex; flex-direction: column; gap: 2px; min-height: 0; padding: 2px; }
  .crow { flex: 1; display: flex; gap: 2px; min-height: 0; background: #080b12; border-radius: 3px;
          border-left: 3px solid #33507e; }
  .crow.live { border-left-color: #f0d24a; }
  .clabel { flex: 0 0 214px; padding: 5px 8px; overflow: hidden; min-width: 0;
            display: flex; flex-direction: column; gap: 4px; }
  .clabel .why { font: 800 9px -apple-system, system-ui, sans-serif; letter-spacing: .07em;
                 color: #9fb3d0; text-transform: uppercase; }
  .clabel .pick { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .clabel .pick .ab { font: 800 9px -apple-system, system-ui, sans-serif; color: var(--ac, #7d92b5);
                      border: 1px solid var(--ac, #33507e); border-radius: 3px; padding: 1px 4px; flex: 0 0 auto; }
  .clabel select { flex: 1; min-width: 0; font: 11px -apple-system, system-ui, sans-serif; color: #d6e2f2;
                   background: #131a2a; border: 1px solid #2a3a5c;
                   border-radius: 4px; padding: 2px 3px; }
  .clabel .prog { font-size: 10px; color: #7d92b5; position: relative; padding-bottom: 3px; }
  .clabel .prog i { position: absolute; left: 0; bottom: 0; height: 2px; background: #3f86d0; border-radius: 2px; }
  .clabel .err { font-size: 10px; color: #ff9aa2; overflow-wrap: anywhere; }
  .clabel .rowbtns { margin-top: auto; display: flex; gap: 4px; }
  .mini { font: 600 11px -apple-system, system-ui, sans-serif; color: #9fb3d0; background: #131a2a;
          border: 1px solid #2a3a5c; border-radius: 4px; padding: 1px 7px; cursor: pointer; }
  .mini:hover { color: #fff; background: #1b2740; }

  .cell { position: relative; flex: 1; min-width: 0; min-height: 0; }
  .cell.hidden { display: none; }
  .cell canvas { width: 100%; height: 100%; display: block; background: #000; touch-action: none;
                 position: absolute; inset: 0; }
  .cell canvas.bside { z-index: 1; }        /* B on top — its opacity IS the blend */
  .cell canvas.xh { z-index: 2; background: transparent; pointer-events: none; }
  .cell .lab { position: absolute; top: 4px; left: 6px; z-index: 3; font-weight: 700; font-size: 10px;
               opacity: .7; pointer-events: none; color: #9fb3d0; }
  /* double-click a cell to maximize it */
  #rows.maxmode .crow { display: none; }
  #rows.maxmode .crow.hasmax { display: flex; flex: 1; }
  #rows.maxmode .crow.hasmax .cell { display: none; }
  #rows.maxmode .crow.hasmax .cell.max { display: block; flex: 1; }

  /* ── bottom strip: jump chips ────────────────────────────────────────────── */
  #strip { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 5px 10px;
           background: #0b0e16; border-top: 1px solid #1b2740; overflow-x: auto; }
  #strip:empty, #jumps:empty { display: none; }
  #jumps { display: flex; gap: 4px; }
  .chip.jump { flex: 0 0 auto; border-color: var(--accent); color: var(--accent); background: #101725; }

  /* ── case picker ─────────────────────────────────────────────────────────── */
  #case-panel[hidden] { display: none; }
  #case-panel { position: fixed; top: 34px; right: 8px; z-index: 20; width: 330px; max-height: 70vh;
                display: flex; flex-direction: column; background: #0b0e16; border: 1px solid #33507e;
                border-radius: 8px; box-shadow: 0 10px 34px rgba(0,0,0,.6); overflow: hidden; }
  #case-search { margin: 8px; padding: 5px 8px; font: 12px -apple-system, system-ui, sans-serif;
                 color: #d6e2f2; background: #131a2a; border: 1px solid #33507e; border-radius: 5px; outline: none; }
  #case-list { overflow-y: auto; padding: 0 6px 6px; }
  #case-list .crow-pick { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
                background: none; border: none; border-radius: 5px; padding: 4px 6px; cursor: pointer;
                font: 12px -apple-system, system-ui, sans-serif; color: #d6e2f2; }
  #case-list .crow-pick:hover { background: #1b2740; }
  #case-list .crow-pick.cur { background: #2b6cb0; }
  #case-list .crow-pick .pid { font-weight: 700; min-width: 86px; font-variant-numeric: tabular-nums; }
  #case-list .crow-pick .st { margin-left: auto; color: #7d92b5; font-size: 11px; font-variant-numeric: tabular-nums; }

  /* ── transfer-function panel ─────────────────────────────────────────────── */
  #tf-panel[hidden] { display: none; }
  #tf-panel { position: fixed; top: 108px; right: 8px; z-index: 21; width: 300px; padding: 9px 10px 10px;
              display: flex; flex-direction: column; gap: 6px; background: #0b0e16;
              border: 1px solid #33507e; border-radius: 8px; box-shadow: 0 10px 34px rgba(0,0,0,.6); }
  #tf-panel.dim { opacity: .5; pointer-events: none; }
  #tf-panel .tfhead { display: flex; align-items: center; gap: 7px; font: 800 9.5px -apple-system, system-ui, sans-serif;
              letter-spacing: .08em; color: #9fb3d0; }
  #tf-panel .tfhead select { flex: 1; min-width: 0; font-weight: 400; letter-spacing: 0; }
  #tf-curve { width: 100%; height: 96px; display: block; background: #05070d;
              border: 1px solid #1b2740; border-radius: 5px; cursor: crosshair; touch-action: none; }
  #tf-panel .tfrow { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #7d92b5; }
  #tf-panel .tfrow label { flex: 0 0 46px; }
  #tf-panel .tfrow select, #tf-panel .tfrow input { flex: 1; min-width: 0; }
  #tf-panel .tfwl { flex: 1; font-variant-numeric: tabular-nums; color: #9fb3d0; }
  select, input[type=range] { font: 11px -apple-system, system-ui, sans-serif; color: #d6e2f2;
            background: #131a2a; border: 1px solid #33507e; border-radius: 4px; padding: 2px 4px; accent-color: #3f86d0; }
</style>
</head>
<body>
  <div id="page">
    <header>
      <h1>ReMINDer</h1>
      <span id="info"></span>
      <div id="cols">
        <button id="col-axial" class="chip on">Axial</button>
        <button id="col-sagittal" class="chip on">Sagittal</button>
        <button id="col-coronal" class="chip on">Coronal</button>
        <button id="col-threeD" class="chip on">3D</button>
      </div>
      <button id="col-link" class="chip on" title="link the 3D camera to the slice zoom/pan (orbit is never linked)">Link 3D</button>
      <div id="hdr-right">
        <span id="status">loading…</span>
        <button id="tf-btn" class="chip" title="transfer function / window-level for the volume rendering">TF ▾</button>
        <button id="case-btn" class="chip" title="choose a case">case ▾</button>
      </div>
    </header>

    <div id="cmpbar">
      <span class="cmplabel">COMPARE</span>
      <button class="chip" data-mode="fade">fade</button>
      <button class="chip" data-mode="rock">rock</button>
      <button class="chip" data-mode="toggle">toggle</button>
      <input id="cmp-fade" type="range" min="0" max="100" value="0" title="blend A ⇄ B (applies to every row)">
      <span id="cmp-note"></span>
      <span class="hintkey"><b>space</b> flips A/B · <b>shift+move</b> crosshair · <b>dbl-click</b> maximize</span>
      <button id="addrow" class="chip" title="add another comparison">+ row</button>
      <span id="cmp-count"></span>
    </div>

    <div id="case-panel" hidden>
      <input id="case-search" type="search" placeholder="filter by id…" autocomplete="off">
      <div id="case-list"></div>
    </div>

    <div id="tf-panel" hidden>
      <div class="tfhead">Transfer function
        <select id="tf-row" title="which resident volume to edit"></select>
      </div>
      <canvas id="tf-curve" title="drag a handle to reshape the opacity curve · click to add a point · alt/right-click to remove"></canvas>
      <div class="tfrow"><label>ramp</label><select id="tf-ramp"></select></div>
      <div class="tfrow"><label>window</label><input id="tf-win" type="range" min="-1" max="1" step="0.01" value="0"></div>
      <div class="tfrow"><label>level</label><input id="tf-lev" type="range" min="-1" max="1" step="0.01" value="0"></div>
      <div class="tfrow"><span id="tf-wl" class="tfwl"></span><button id="tf-reset" class="chip">reset</button></div>
    </div>

    <div id="rows"></div>
    <div id="strip"><div id="jumps"></div></div>
  </div>
  <script type="module" src="remind-compare.js?v=20260822a"></script>   <!-- bump per deploy: stale cached bundles read as phantom behaviour -->
</body>
</html>
